adapters:
  eskimi:
    endpoint: https://ittr.eskimi.com/prebidjs
    modifying-vast-xml-allowed: false
    ortb-version: "2.6"
    meta-info:
      maintainer-email: prebid@eskimi.com
      app-media-types:
        - banner
        - video
      site-media-types:
        - banner
        - video
      supported-vendors:
      vendor-id: 814
    usersync:
      cookie-family-name: eskimi
      redirect:
        url: https://ittpx.eskimi.com/sync?sp_id=137&gdpr={gdpr}&gdpr_consent={gdpr_consent}&us_privacy={us_privacy}&gpp={gpp}&gpp_sid={gpp_sid}&dest={redirect_url}
      user-macro: '${USER_ID}'
