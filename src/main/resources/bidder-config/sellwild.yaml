adapters:
  sellwild:
    endpoint: https://exchange.sellwild.com/exchange/openrtb2/{PublisherId}
    ortb-version: "2.6"
    # The partner token travels in imp.ext.bidder, so keep the outbound request out of debug output.
    debug:
      allow: false
    meta-info:
      maintainer-email: support@sellwild.com
      app-media-types:
        - banner
        - video
        - native
      site-media-types:
        - banner
        - video
        - native
      supported-vendors:
      vendor-id: 0
