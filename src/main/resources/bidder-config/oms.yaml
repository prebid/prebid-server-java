adapters:
  oms:
    endpoint: http://rt.marphezis.com/pbs?publisherId={PublisherId}
    modifying-vast-xml-allowed: true
    meta-info:
      maintainer-email: prebid@onlinemediasolutions.com
      app-media-types:
        - banner
        - video
      site-media-types:
        - banner
        - video
      supported-vendors:
      vendor-id: 883
    usersync:
      cookie-family-name: oms
      iframe:
        url: https://rt.marphezis.com/sync/pub?pubid=pbs&gdpr={gdpr}&gdpr_consent={gdpr_consent}&us_privacy={us_privacy}&gpp={gpp}&gpp_sid={gpp_sid}&rurl={redirect_url}
        uid-macro: $USERID
