adapters:
  riptide:
    endpoint: https://serve.riptideads.com/ortb
    # The Riptide endpoint accepts gzip request bodies.
    endpoint-compression: gzip
    ortb-version: "2.6"
    meta-info:
      maintainer-email: prebid@riptideads.com
      app-media-types:
        - banner
        - video
        - audio
        - native
      site-media-types:
        - banner
        - video
        - audio
        - native
      dooh-media-types:
        - banner
        - video
        - native
      supported-vendors:
      # No IAB TCF Global Vendor List id is registered for the parent code yet.
      vendor-id: 0
    usersync:
      cookie-family-name: riptide
      redirect:
        url: https://sync.riptideads.com/usersync?gdpr={gdpr}&gdpr_consent={gdpr_consent}&us_privacy={us_privacy}&gpp={gpp}&gpp_sid={gpp_sid}&redir={redirect_url}
        uid-macro: '$UID'
