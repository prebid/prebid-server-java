adapters:
  adplayx:
    enabled: true
    endpoint: "https://api.adplayx.net/v1.0/ortb?apptoken={{apptoken}}"
    pbs-enforces-ccpa: true
    modifying-vast-xml-allowed: true
    meta-info:
      maintainer-email: "support@adplayx.com"
      app-media-types:
        - banner
        - video
      site-media-types:
        - banner
        - video
      supported-vendors: []
      vendor-id: 0
