adapters:
  mediago:
    endpoint: https://REGION.mediago.io/api/bid?tn={AccountID}
    endpoint-compression: gzip
    geoscope:
      - USA
      - DEU
      - JPN
      - GBR
      - KOR
      - CAN
      - FRA
      - ITA
    aliases:
      mgtechnology:
        enabled: false
        endpoint: https://gbid.mediagotechnology.com/api/bid?tn={AccountID}
        meta-info:
          vendor-id: 1575
        usersync:
          cookie-family-name: mgtechnology
          redirect:
            url: https://go.mediagotechnology.com/ju/cs/prebid?gdpr={gdpr}&gdpr_consent={gdpr_consent}&us_privacy={us_privacy}&redirect={redirect_url}
            uid-macro: '$UID'
    meta-info:
      maintainer-email: ext_mediago_cm@baidu.com
      app-media-types:
      site-media-types:
        - banner
        - native
      supported-vendors:
      vendor-id: 1020
    usersync:
      cookie-family-name: mediago
      redirect:
        url: https://trace.mediago.io/ju/cs/prebid?gdpr={gdpr}&gdpr_consent={gdpr_consent}&us_privacy={us_privacy}&redirect={redirect_url}
        uid-macro: '$UID'
